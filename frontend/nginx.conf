server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback — all unmatched paths serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes asset filenames, so they can be cached forever
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    image/svg+xml;
}
